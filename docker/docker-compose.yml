services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "4000:4000"
    volumes:
      - backend-data:/app/data
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATABASE_URL=file:./data/cold-dialer.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
