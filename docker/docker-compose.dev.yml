services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - PORT=4000
      - JWT_SECRET=dev-secret-change-in-production
      - DATABASE_URL=file:./data/cold-dialer.db
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000
    command: npm run dev
